name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Windows runner 上 Python 的标准输出被重定向到文件时，编码会退化成系统 ANSI
# 代码页（cp1252），一旦 print 中文就抛 UnicodeEncodeError 让步骤直接失败。
# 统一开启 UTF-8 模式：回归测试与 build.py 的日志里都有中文，必须在这里兜住。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  check:
    name: 语法自检与回归测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法自检
        run: python -m compileall -q netdoctor app.py tests build

      - name: 确认 tkinter 可用
        # compileall 不会导入模块，缺 tkinter 时语法检查照样通过，
        # 但打出来的 exe 一开图形界面就会崩，因此这里显式导入一次。
        run: |
          python -c "import tkinter, tkinter.ttk, tkinter.filedialog, tkinter.messagebox; print('tkinter', tkinter.TkVersion)"

      - name: 判定引擎回归测试
        run: python tests/test_diagnose.py

  release:
    name: 打包并发布 Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装构建依赖
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: 生成图标
        run: python build/make_icon.py

      - name: 打包单文件版
        run: python build/build.py onefile

      - name: 打包文件夹版并压缩
        run: |
          python build/build.py onedir
          Compress-Archive -Path out/dist/onedir/NetDoctor/* -DestinationPath out/dist/NetDoctor-onedir.zip

      - name: 发布 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/dist/onefile/NetDoctor.exe
            out/dist/NetDoctor-onedir.zip
          generate_release_notes: true
